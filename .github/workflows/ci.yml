name: Frontend CI
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
env:
  NEXT_PUBLIC_CONTRACT_ID: ci-placeholder
  NEXT_PUBLIC_SOROBAN_RPC: https://soroban-testnet.stellar.org
  NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
  NEXT_PUBLIC_IPFS_GATEWAY: https://gateway.pinata.cloud/ipfs
  NEXT_PUBLIC_API_URL: http://localhost:4000
  NEXT_PUBLIC_APP_URL: https://promiscope.example
  NEXT_PUBLIC_STATUS_PAGE_URL: ''
  NEXT_PUBLIC_ADMIN_ADDRESS: ''
  PINATA_API_KEY: ci-placeholder
  PINATA_SECRET: ci-placeholder
  PLATFORM_CONTACT_FEE_XLM: '1'
  UPSTASH_REDIS_REST_URL: ''
  UPSTASH_REDIS_REST_TOKEN: ''
  MEDIA_URL_SIGNING_SECRET: ''
  API_URL_INTERNAL: ''
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: ''
  NEXT_PUBLIC_INDEXER_API_URL: http://localhost:3001
  NEXT_PUBLIC_DOMAIN: localhost:3000
  NEXT_PUBLIC_SENTRY_DSN: ''
  SENTRY_ORG: ''
  SENTRY_PROJECT: ''
  SENTRY_AUTH_TOKEN: ''
  SENTRY_RELEASE: ''
  SEP10_SERVER_KEY: ''
  SEP10_HOME_DOMAIN: ''
  SEP10_ALLOWED_ORIGINS: ''
  NEXT_PUBLIC_SEP10_SERVER_ACCOUNT: ''
  NEXT_PUBLIC_SEP10_HOME_DOMAIN: ''
  NEXT_PUBLIC_BASE_URL: ''
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24
        cache: npm
    - run: npm ci --no-audit --no-fund
    - run: npm run format:check
    - run: npm run lint
    - run: npm run type-check
    - run: npm run test
    - name: Accessibility (axe) checks
      run: npx jest --ci --testPathPattern='a11y'
    - run: node scripts/validate-env.js
    - run: node scripts/check-locale-keys.js
    - name: Storybook coverage check (components/ui)
      run: node scripts/check-storybook-coverage.js
    - run: npm run build
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: .next
        key: ${{ runner.os }}-next-build-${{ hashFiles('package-lock.json') }}
        restore-keys: ${{ runner.os }}-next-build-
    - name: Verify PWA icons exist
      run: "node -e \"\n  const fs = require('fs');\n  const manifest = JSON.parse(fs.readFileSync('public/manifest.json',\
        \ 'utf8'));\n  let missing = [];\n  for (const icon of manifest.icons) {\n\
        \    const file = 'public' + icon.src;\n    if (!fs.existsSync(file)) missing.push(file);\n\
        \  }\n  if (missing.length) { console.error('Missing icons:', missing.join(',\
        \ ')); process.exit(1); }\n  console.log('All', manifest.icons.length, 'manifest\
        \ icons present.');\n\"\n"
    - name: Guard against committed .data/ artifacts
      run: "# .gitignore was historically `.data/` (with a leading dot) — the\n# typo\
        \ has been fixed to `/data/` (lib/referralStore.ts writes\n# to a root-anchored\
        \ `data/`). Guard against any tracked files\n# under either path so we catch\
        \ drift in either direction.\ntracked=$(git ls-files -- '.data/**' 'data/**')\n\
        if [ -n \"$tracked\" ]; then\n  echo \"Tracked files found under runtime data\
        \ dirs (dev-only referral store artifacts, should be gitignored):\"\n  echo\
        \ \"$tracked\"\n  exit 1\nfi\necho \"No tracked files under .data/ or data/.\"\
        \n"
    - name: Guard against orphaned gitlinks
      run: "# Fail if any gitlink (mode 160000) exists without a .gitmodules entry.\n\
        # This prevents orphaned submodule references from accumulating in the index.\n\
        if git ls-files -s | awk '$1==160000' | grep -q .; then\n  if [ ! -f .gitmodules\
        \ ]; then\n    echo \"Error: gitlink(s) found without .gitmodules file\"\n\
        \    git ls-files -s | awk '$1==160000'\n    exit 1\n  fi\nfi\necho \"No orphaned\
        \ gitlinks found.\"\n"
    - name: Validate docs/pr-bodies/ body-file contract
      run: node scripts/validate-pr-bodies.js
  test-coverage-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24
        cache: npm
    - run: npm ci --no-audit --no-fund
    - name: Check new/changed files have a matching test
      env:
        BASE_REF: origin/${{ github.event.pull_request.base.ref }}
      run: node scripts/check-test-coverage-diff.js
  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24
        cache: npm
    - run: npm ci --no-audit --no-fund
    - name: Run tests with coverage
      run: npm run test -- --coverage --ci --coverageReporters=lcov --coverageReporters=text-summary
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
      with:
        files: ./coverage/lcov.info
        flags: frontend
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    - name: Write coverage summary to job summary
      if: always()
      run: "echo \"## Test Coverage Summary\" >> $GITHUB_STEP_SUMMARY\necho \"\" >>\
        \ $GITHUB_STEP_SUMMARY\necho '```' >> $GITHUB_STEP_SUMMARY\ncat coverage/coverage-summary.json\
        \ 2>/dev/null \\\n  | node -e \"\n      const data = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));\n\
        \      const t = data.total;\n      console.log('Lines     : ' + t.lines.pct\
        \ + '% (' + t.lines.covered + '/' + t.lines.total + ')');\n      console.log('Branches\
        \  : ' + t.branches.pct + '% (' + t.branches.covered + '/' + t.branches.total\
        \ + ')');\n      console.log('Functions : ' + t.functions.pct + '% (' + t.functions.covered\
        \ + '/' + t.functions.total + ')');\n      console.log('Statements: ' + t.statements.pct\
        \ + '% (' + t.statements.covered + '/' + t.statements.total + ')');\n    \"\
        \ 2>/dev/null || echo \"Coverage summary not available\"\necho '```' >> $GITHUB_STEP_SUMMARY\n"
  indexer:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24
        cache: npm
    - run: npm ci --no-audit --no-fund
    - name: Build indexer
      run: npm run build --workspace=packages/indexer
    - name: Test indexer
      run: npm test --workspace=packages/indexer
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: server/package-lock.json
    - run: npm ci
    - name: Test backend
      run: node --test --experimental-test-coverage test/
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24
        cache: npm
    - run: npm ci --no-audit --no-fund
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: .next
        key: ${{ runner.os }}-next-build-${{ hashFiles('package-lock.json') }}
        restore-keys: ${{ runner.os }}-next-build-
    - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24
        cache: npm
    - run: npm ci --no-audit --no-fund
    - name: Install Playwright browser
      run: npx playwright install --with-deps chromium
    - name: Playwright suite
      run: npm run test:e2e
    - name: Session lifecycle specs (10s token TTL, no retries)
      run: npm run test:e2e:sessions -- --retries=0
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: playwright-artifacts
        path: 'test-results/

          playwright-report/

          '
        retention-days: 7
        if-no-files-found: ignore
  build-storybook:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24
        cache: npm
    - run: npm ci --no-audit --no-fund
    - run: npm run build-storybook
    - run: npx playwright install --with-deps chromium
    - run: npm run test-storybook:ci
  lighthouse:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24
        cache: npm
    - run: npm ci --no-audit --no-fund
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: .next
        key: ${{ runner.os }}-next-build-${{ hashFiles('package-lock.json') }}
        restore-keys: ${{ runner.os }}-next-build-
    - run: npm run build
    - run: npx --no-install lhci autorun
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: lighthouse-report
        path: lighthouse-report/
  bundle-size:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
    - run: npm ci --no-audit --no-fund
    - uses: actions/cache@v4
      with:
        path: .next
        key: ${{ runner.os }}-next-build-${{ hashFiles('package-lock.json') }}
        restore-keys: ${{ runner.os }}-next-build-
    - name: Build (cache miss fallback)
      run: npm run build
    - name: Check bundle sizes against budget
      id: size_check
      run: npx size-limit --json > size-limit-report.json
      continue-on-error: true
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bundle-size-report
        path: size-limit-report.json
    - name: Post bundle-size summary
      if: always()
      run: "echo \"## Bundle Size Report\" >> $GITHUB_STEP_SUMMARY\necho \"\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"| Chunk | Size (gzip) | Limit | Status |\" >> $GITHUB_STEP_SUMMARY\n\
        echo \"|-------|------------|-------|--------|\" >> $GITHUB_STEP_SUMMARY\n\
        node -e \"\n  const fs = require('fs');\n  let report;\n  try {\n    report\
        \ = JSON.parse(fs.readFileSync('size-limit-report.json', 'utf8'));\n  } catch\
        \ (e) {\n    console.log('| _Report unavailable_ | – | – | ❓ |');\n    process.exit(0);\n\
        \  }\n  for (const entry of report) {\n    const sizeKb = (entry.size / 1024).toFixed(1);\n\
        \    const limitKb = entry.limit || 'none';\n    const passed = entry.passed\
        \ !== false;\n    const icon = passed ? '✅' : '❌';\n    console.log(\\`| \\\
        ${entry.name} | \\${sizeKb} kB | \\${limitKb} | \\${icon} |\\`);\n  }\n\"\
        \ >> $GITHUB_STEP_SUMMARY\n"
    - name: Enforce budget (fail if over limit)
      if: steps.size_check.outcome == 'failure'
      run: 'echo "One or more bundle chunks exceed their size budget. See the summary
        above."

        exit 1

        '
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
