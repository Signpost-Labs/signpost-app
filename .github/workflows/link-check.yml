name: Link Checker

on:
  schedule:
    - cron: '0 0 * * 0' # Runs every Sunday at 00:00 UTC
  workflow_dispatch:

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run lychee link checker
        uses: lycheeverse/lychee-action@2b973e86fc7b1f6b36a93795fe2c9c6ae1118621 # v1.10.0
        with:
          # Exclusions rationale:
          # 1. 'mailto:': Email address URI schemes cannot be verified via HTTP HEAD/GET requests.
          # 2. 'github.com/.*#': GitHub heading anchors are resolved client-side in the browser DOM,
          #    causing server-side HTTP checks from automated CI tools to fail with false-positive
          #    404/403 errors or trigger anti-scraping rate limits.
          args: "--no-progress --exclude 'mailto|github.com/.*#' README.md DEVELOPMENT.md DEPLOYMENT.md CONTRIBUTING.md SECURITY.md 'docs/**/*.md' '.github/**/*.md' packages/indexer/README.md"
          fail: true
