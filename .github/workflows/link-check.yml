name: Link Checker

on:
  schedule:
    - cron: '0 0 * * 0' # Runs every Sunday at 00:00 UTC
  workflow_dispatch:

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run lychee link checker
        uses: lycheeverse/lychee-action@2b973e86fc7b1f6b36a93795fe2c9c6ae1118621 # v1.10.0
        with:
          args: >-
            --no-progress
            --exclude 'mailto|github.com/.*#'
            README.md DEVELOPMENT.md DEPLOYMENT.md CONTRIBUTING.md
            SECURITY.md packages/indexer/README.md
            docs/**/*.md .github/**/*.md
          # SECURITY.md + the whole docs/ tree (+ .github md files) are
          # covered now — the exclusion kept only for mailto: and GitHub
          # anchor links (github.com/...#… needs a rendered page; lychee
          # can't resolve the fragment against the raw file).
          # The workflow will fail if any broken links are found.
