name: Link Checker

on:
  schedule:
    - cron: '0 0 * * 0' # Runs every Sunday at 00:00 UTC
  workflow_dispatch:

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run lychee link checker
        uses: lycheeverse/lychee-action@2b973e86fc7b1f6b36a93795fe2c9c6ae1118621 # v1.10.0
        with:
          # Ignore mailto: URIs (not HTTP links). GitHub fragment anchors are resolved
          # by the rendered page and can give unreliable results to HTTP-only checkers.
          # Quoted recursive globs are expanded by lychee, including nested docs files.
          args: "--no-progress --exclude 'mailto|github.com/.*#' README.md DEVELOPMENT.md DEPLOYMENT.md CONTRIBUTING.md packages/indexer/README.md SECURITY.md 'docs/**/*.md' '.github/**/*.md'"
          fail: true
