name: Visual Regression
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
jobs:
  visual-regression:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24
        cache: npm
    - run: npm ci --no-audit --no-fund
    # Compare Storybook visual regressions against committed baselines in
    # e2e/visual/storybook.visual.spec.ts-snapshots/. Fails on visual drift beyond
    # the maxDiffPixelRatio tolerance configured in playwright.visual.config.ts.
    - name: Run Storybook visual regression tests
      run: npm run test:visual
    - name: Upload visual regression diff report on failure
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: visual-regression-report
        path: |
          test-results/
          playwright-report/
        retention-days: 14
        if-no-files-found: ignore
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
