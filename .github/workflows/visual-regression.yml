name: Visual Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'components/**'
      - 'app/**'
      - 'styles/**'
      - '.storybook/**'
      - 'e2e/visual/**'
      - 'playwright.visual.config.ts'
      - 'package.json'
  workflow_dispatch:

concurrency:
  group: visual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Storybook visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      # Official Playwright image matches our pinned @playwright/test version
      # so snapshots rendered in CI are byte-deterministic across runs.
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Storybook
        run: npm run build-storybook -- --quiet

      - name: Run visual regression tests against committed baselines
        run: npm run test:visual

      - name: Upload Playwright report and diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-regression-report
          path: |
            playwright-report-visual/
            test-results/visual/
          retention-days: 14
